<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hero Design QA Comparison</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:#d8d8d8;color:#15171b;font:14px/1.4 system-ui,sans-serif}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{overflow:hidden;border:1px solid #aaa;border-radius:14px;background:#fff}.label{padding:10px 14px;border-bottom:1px solid #ddd;font-weight:700}.canvas{position:relative;height:660px;overflow:hidden;background:#f7f7f7}.source{width:100%;height:100%;object-fit:contain;object-position:top center}.implementation{position:absolute;top:0;left:0;width:1504px;height:1128px;border:0;transform:scale(.45);transform-origin:top left}@media(max-width:900px){.comparison{grid-template-columns:1fr}.canvas{height:690px}}
  </style>
</head>
<body>
  <main class="comparison">
    <section class="panel"><div class="label">Source reference — 1504 × 1128 px</div><div class="canvas"><img class="source" src="img/qa-hero-reference.webp" alt="Attached reference for the redesigned 9Seven hero"></div></section>
    <section class="panel"><div class="label">Implementation — 1504 × 1128 CSS px</div><div class="canvas"><iframe class="implementation" src="/#home" title="Rendered 9Seven hero implementation"></iframe></div></section>
  </main>
</body>
</html>
